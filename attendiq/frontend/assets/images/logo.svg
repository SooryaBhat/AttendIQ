<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Outer rounded square container -->
  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="20" y="20" width="216" height="216" rx="48" ry="48" fill="url(#gradientBg)"/>
  
  <!-- Central circle background for the icon -->
  <circle cx="128" cy="128" r="90" fill="#ffffff" opacity="0.15"/>
  
  <!-- Graduation cap bottom line -->
  <rect x="70" y="140" width="116" height="12" rx="6" fill="url(#gradientAccent)" opacity="0.9"/>
  
  <!-- Graduation cap top (mortarboard) -->
  <path d="M 70 130 L 90 100 L 128 90 L 166 100 L 186 130 Z" fill="url(#gradientAccent)" opacity="0.8"/>
  
  <!-- AI node pattern - top left -->
  <circle cx="95" cy="105" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="95" cy="105" r="4" fill="url(#gradientAccent)"/>
  
  <!-- AI node pattern - top right -->
  <circle cx="161" cy="105" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="161" cy="105" r="4" fill="url(#gradientAccent)"/>
  
  <!-- AI node pattern - center -->
  <circle cx="128" cy="125" r="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="128" cy="125" r="5" fill="url(#gradientAccent)"/>
  
  <!-- Connection lines (network/AI theme) -->
  <line x1="95" y1="105" x2="128" y2="125" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="161" y1="105" x2="128" y2="125" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  
  <!-- Checkmark (attendance confirmation) -->
  <path d="M 105 155 L 120 170 L 155 135" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  
  <!-- Subtle decorative dots -->
  <circle cx="70" cy="170" r="4" fill="#ffffff" opacity="0.4"/>
  <circle cx="186" cy="170" r="4" fill="#ffffff" opacity="0.4"/>
</svg>
